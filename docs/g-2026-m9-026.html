.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
header.top{padding:56px 0 28px}

.bar{display:flex;gap:12px;align-items:center;margin:22px 0 8px}
.bar input{flex:1;max-width:360px;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);font:inherit}
.count{color:var(--mut);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px;padding:12px 0 64px}
.card{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;color:inherit;transition:transform .15s,box-shadow .15s}

.thumb{aspect-ratio:4/3;background:#fff;display:flex;align-items:center;justify-content:center;padding:18px;border-bottom:1px solid var(--line)}
.thumb img{max-width:100%;max-height:100%;object-fit:contain}
.thumb.empty{color:#999;font-size:40px;font-weight:700}
.meta{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.meta h3{margin:0;font-size:18px}
.meta p{margin:0;color:var(--mut);font-size:14px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.dots{display:flex;gap:6px;margin-top:auto;padding-top:6px}
.dots i,.sw{display:inline-block;width:14px;height:14px;border-radius:50%;border:1px solid rgba(128,128,128,.4)}
.sw{margin-right:6px;vertical-align:-2px}
article{padding:36px 0 72px;max-width:780px}
.back{display:inline-block;margin-top:28px;font-size:14px}
article h1{font-size:clamp(28px,5vw,42px);letter-spacing:-.02em;line-height:1.15;margin:8px 0 16px}
.lead{font-size:18px;color:var(--mut);margin:0 0 24px}
article h2{margin:36px 0 10px;font-size:22px}
article h3{margin:24px 0 8px}
article figure{margin:20px 0;background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;text-align:center}

article p>img{display:block;margin:12px 0}
code{font:13.5px ui-monospace,SFMono-Regular,Menlo,monospace;background:rgba(128,128,128,.14);padding:2px 6px;border-radius:6px}
.tw{overflow-x:auto;margin:14px 0}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line)}
th{color:var(--mut);font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:.04em}
blockquote{margin:16px 0;padding:4px 16px;border-left:3px solid var(--acc);color:var(--mut)}
pre{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
footer{border-top:1px solid var(--line);padding:24px 0 40px;color:var(--mut);font-size:14px}

nav.main{display:flex;gap:6px;padding:18px 0 0}
nav.main a{padding:7px 14px;border-radius:999px;color:var(--mut);font-size:15px;font-weight:600}
nav.main a:hover{text-decoration:none;color:var(--fg)}
nav.main a.on{background:var(--fg);color:var(--bg)}
h2.sec{margin:34px 0 4px;font-size:24px}
.sub{color:var(--mut);margin:0 0 6px;font-size:15px}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px;padding:12px 0 8px}

.masonry{columns:220px;column-gap:12px;padding:6px 0 48px}

.lb{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;z-index:50;flex-direction:column;padding:16px}

.lb p{color:#ddd;margin:10px 0 0;font-size:14px;text-align:center;max-width:90vw}
.lb button{position:absolute;top:12px;right:14px;background:none;border:0;color:#fff;font-size:34px;cursor:pointer;line-height:1}
.lb .nv{position:absolute;top:50%;transform:translateY(-50%);font-size:40px;padding:8px 14px}
.lb .pv{left:6px;right:auto}.lb .nx{right:6px}
